<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="overflow: hidden;"> <div id="welcome-screen">
        <div class="welcome-content">
            <h1>Echo.</h1>
            <p>Klik tombolnya mas</p>
            <button id="enter-btn">ini</button>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo">Echo.</div>
        <div class="nav-right">
            <ul class="nav-links" id="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#timeline">Perjalanan</a></li>
                <li><a href="#galeri">Galeri</a></li>
                <li><a href="#pesan">Pesan</a></li>
            </ul>
            <div class="nav-buttons">
                <button id="theme-toggle" class="theme-btn" title="Ganti Tema">☀️</button>
                <div class="hamburger" id="hamburger-btn">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </nav>

    <header id="home" class="hero">
        <video muted loop playsinline id="myVideo">
            <source src="video/bg.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <div class="hero-content" data-aos="fade-up" data-aos-duration="1500">
            <span class="badge">OFFICIAL ECHO </span>
            <h1>KITA PERNAH <span class="highlight typing-text"></span></h1>
            <p>Penghuni Pojok Kanan.</p>
            <a href="#galeri" class="btn-glow">Jelajahi</a>
        </div>
    </header>

    <section id="timeline" class="timeline-section">
        <h2 data-aos="fade-up">Garis Waktu</h2>
        <div class="timeline" id="timeline-container">
            <!-- Timeline dinamis dimuat dari localStorage -->
        </div>
    </section>

    <section id="galeri" class="gallery-section">
        <h2 data-aos="fade-up">Memo</h2>
        <div class="masonry-grid" id="gallery-container">
            <!-- Galeri dinamis dimuat dari localStorage -->
        </div>
    </section>

    <section class="video-section" id="video-container">
        <!-- Video dinamis dimuat dari localStorage -->
    </section>

    <section id="pesan" class="messages-section">
        <h2 data-aos="fade-up">Kata Bocah</h2>
        <div class="scrolling-container"> 
            <div class="scrolling-wrapper" id="messages-container">
                <!-- Pesan dinamis dimuat dari localStorage -->
            </div>
        </div>
    </section>

    <footer>
        <h3>Echo.</h3>
        <p>Created with <a href="admin.html" style="text-decoration:none; color:inherit;">by</a> AL.</p>
    </footer>

    <div class="music-fab" style="display: none;"> <button id="music-btn">⏸</button> <audio id="bg-music" loop>
            <source src="lagu/masa.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
